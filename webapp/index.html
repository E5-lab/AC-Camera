<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoiseAtlas 噪声图谱 · 厂区噪声普查与预测</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<div id="app">
  <!-- ── 菜单栏 ── -->
  <nav id="menubar">
    <div class="brand">
      <img class="logo" src="/icon-32.png" alt="" />
      <span class="brand-text">
        <b>NoiseAtlas</b>
        <small>噪声图谱</small>
      </span>
    </div>
    <button class="menu" data-menu="file">文件</button>
    <button class="menu" data-menu="edit">编辑</button>
    <button class="menu" data-menu="view">视图</button>
    <button class="menu" data-menu="calc">计算</button>
    <button class="menu" data-menu="help">帮助</button>
    <span class="spacer"></span>
    <span id="menubar-hint" class="hint-inline">厂区噪声网格普查 · 等声压级成图 · 噪声源定位</span>
  </nav>

  <div class="menu-panel" id="menu-file" hidden>
    <button data-cmd="new-project">新建项目…</button>
    <button data-cmd="demo">载入示例项目</button>
    <div class="menu-sep"></div>
    <button data-cmd="import">导入数据 (JSON)…</button>
    <button data-cmd="export">导出数据 (JSON)…</button>
    <div class="menu-sep"></div>
    <button data-cmd="export-img">导出图像 (PNG)…</button>
    <button data-cmd="export-pdf">导出 PDF…</button>
    <button data-cmd="copy-img">复制图像到剪贴板</button>
  </div>

  <div class="menu-panel" id="menu-edit" hidden>
    <button data-cmd="delete-project">删除当前项目</button>
    <button data-cmd="clear-measurements">清空当前项目测点</button>
    <div class="menu-sep"></div>
    <button data-cmd="clear-noise-flags">清除噪声源标记</button>
  </div>

  <div class="menu-panel" id="menu-view" hidden>
    <button data-cmd="tab-entry">数据录入</button>
    <button data-cmd="tab-contour">等声压级图</button>
    <button data-cmd="tab-settings">网格设置</button>
    <div class="menu-sep"></div>
    <button data-cmd="zoom-fit">缩放到全图</button>
    <div class="menu-sep"></div>
    <button data-cmd="tb-icon">工具栏：仅图标</button>
    <button data-cmd="tb-text">工具栏：仅文字</button>
    <button data-cmd="tb-both">工具栏：图标 + 文字</button>
    <div class="menu-sep"></div>
    <button data-cmd="toggle-calib">显示 / 隐藏定标线段</button>
    <button data-cmd="toggle-points">显示 / 隐藏测点</button>
  </div>

  <div class="menu-panel" id="menu-calc" hidden>
    <button data-cmd="noise">识别噪声源…</button>
    <button data-cmd="recompute">重新计算声场</button>
    <div class="menu-sep"></div>
    <button data-cmd="basemap">导入底图…</button>
    <button data-cmd="calibrate">两点定标</button>
  </div>

  <div class="menu-panel" id="menu-help" hidden>
    <button data-cmd="about">关于 NoiseAtlas</button>
  </div>

  <!-- ── 工具条 ── -->
  <header id="toolbar" class="mode-both">
    <div class="tb-group">
      <button id="btn-new-project" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        <span class="tb-label">新建</span>
      </button>
      <button id="btn-demo" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 2l1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6z"/></svg>
        <span class="tb-label">示例</span>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button id="btn-import" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg>
        <span class="tb-label">导入</span>
      </button>
      <button id="btn-export" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 11V3M5 6l3-3 3 3M3 13h10"/></svg>
        <span class="tb-label">导出</span>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group viewtabs">
      <button data-tab="entry" class="tb viewtab active">
        <svg class="ic" viewBox="0 0 16 16"><path d="M3 3h10v10H3zM3 8h10M8 3v10"/></svg>
        <span class="tb-label">数据录入</span>
      </button>
      <button data-tab="contour" class="tb viewtab">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 11c2-4 5-6 8-6s4 1 4 1M2 13c3-3 7-4 12-3"/></svg>
        <span class="tb-label">等声压级图</span>
      </button>
      <button data-tab="settings" class="tb viewtab">
        <svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/></svg>
        <span class="tb-label">网格设置</span>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group zoombar">
      <button data-zoom="out" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M3 8h10"/></svg>
        <span class="tb-label">缩小</span>
      </button>
      <button data-zoom="in" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        <span class="tb-label">放大</span>
      </button>
      <button data-zoom="fit" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 6V2h4M14 10v4h-4M2 10v4h4M14 6V2h-4"/></svg>
        <span class="tb-label">适应窗口</span>
      </button>
      <span id="zoom-readout" class="readout">1.0×</span>
    </div>
    <span class="spacer"></span>
    <div class="tb-group">
      <button id="btn-basemap" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 4h12v8H2zM2 10l3-3 3 3 2-2 4 4"/></svg>
        <span class="tb-label">导入底图</span>
      </button>
      <button id="btn-calibrate" class="tb">
        <svg class="ic" viewBox="0 0 16 16"><path d="M2 12l10-10M4 12v2M7 9v2M10 6v2M12 4v2"/></svg>
        <span class="tb-label">两点定标</span>
      </button>
      <button id="btn-noise" class="tb strong">
        <svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="1.6"/></svg>
        <span class="tb-label">识别噪声源</span>
      </button>
    </div>
  </header>

  <div id="body">
    <!-- ── 左侧：对象树 ── -->
    <aside id="sidebar">
      <div class="panel-title">对象树</div>
      <div id="obj-tree" class="tree scroll"></div>

      <div class="panel-title">项目 <span id="project-count" class="badge">0</span></div>
      <div id="project-list" class="scroll short"></div>

      <div class="spacer-v"></div>
      <div id="storage-hint" class="hint small"></div>
    </aside>

    <!-- ── 中央：绘图区 ── -->
    <main id="main">
      <div id="empty-state" class="empty">
        <div class="empty-box">
          <div class="empty-title">未打开项目</div>
          <div class="empty-sub">从「文件 → 新建项目」开始，或载入示例项目体验。</div>
        </div>
      </div>

      <div id="workspace" hidden>
        <section id="tab-entry" class="tab-page">
          <div id="entry-canvas-wrap" class="canvas-wrap"></div>
        </section>

        <section id="tab-contour" class="tab-page split" hidden>
          <div id="contour-canvas-wrap" class="canvas-wrap"></div>
          <aside id="right-dock">
            <div class="panel-title">显示</div>
            <div class="chk-list">
              <label><input type="checkbox" id="chk-calib" checked /> 定标线段</label>
              <label><input type="checkbox" id="chk-points" checked /> 测点</label>
              <label><input type="checkbox" id="chk-contours" checked /> 等值线</label>
              <label><input type="checkbox" id="chk-gridlines" checked /> 网格线</label>
            </div>

            <div class="panel-title">色阶分级</div>
            <div id="band-choices" class="band-grid"></div>

            <div class="panel-title">声场透明度</div>
            <div class="ctl-row">
              <input type="range" id="alpha-slider" min="10" max="100" value="72" />
              <span id="alpha-label" class="readout">72%</span>
            </div>

            <div class="panel-title">声压级标尺</div>
            <div id="contour-legend"></div>

            <div class="panel-title">底图对齐</div>
            <div id="basemap-hint" class="hint small"></div>
            <div class="btn-grid">
              <button data-bm="in">底图＋</button>
              <button data-bm="out">底图－</button>
              <button data-bm="left">←</button>
              <button data-bm="right">→</button>
              <button data-bm="up">↑</button>
              <button data-bm="down">↓</button>
              <button data-bm="reset" class="span2">复位底图</button>
            </div>

            <div class="panel-title">输出</div>
            <div class="btn-grid">
              <button id="btn-export-img" class="span2">导出图像 (PNG)</button>
              <button id="btn-export-pdf" class="span2">导出 PDF</button>
              <button id="btn-copy-img" class="span2">复制图像到剪贴板</button>
            </div>

            <div class="panel-title">统计</div>
            <div id="contour-stats" class="kv"></div>
            <div id="noise-hint" class="hint small"></div>
          </aside>
        </section>

        <section id="tab-settings" class="tab-page" hidden>
          <form id="settings-form" class="form-grid">
            <label>项目名称 <input name="name" required /></label>
            <label>备注（厂名 / 区域） <input name="description" /></label>
            <label>列数（网格单元） <input name="cols" type="number" min="2" max="80" required /></label>
            <label>行数（网格单元） <input name="rows" type="number" min="2" max="80" required /></label>
            <label>列间距 (m) <input name="spacingX" type="number" step="0.1" min="0.1" required /></label>
            <label>行间距 (m) <input name="spacingY" type="number" step="0.1" min="0.1" required /></label>
            <label>底图参照宽度 (m)
              <input name="planReferenceMeters" type="number" step="0.1" min="0" />
            </label>
            <label>背景噪声 / 底噪 (dBA)
              <input name="backgroundNoiseDb" type="number" step="0.1" min="0" />
            </label>
            <div class="form-actions">
              <button class="primary" type="submit">保存设置</button>
            </div>
          </form>
        </section>

        <div id="calib-banner" class="calib-banner" hidden>
          校准模式：在底图上依次点击两个已知实际距离的点（如厂房轴线两端）。按 Esc 或再点「两点定标」退出。
        </div>
      </div>
    </main>
  </div>

  <!-- ── 状态栏 ── -->
  <footer id="statusbar">
    <span id="st-coords">X — m　Y — m</span>
    <span class="sb-sep"></span>
    <span id="st-zoom">缩放 1.0×</span>
    <span class="sb-sep"></span>
    <span id="st-progress">已测 0 / 0</span>
    <span class="sb-sep"></span>
    <span id="st-grid">网格 —</span>
    <span class="spacer"></span>
    <span id="st-hint">滚轮缩放 · 拖动平移 · 单击交汇点录入</span>
  </footer>
</div>

<dialog id="point-dialog">
  <form method="dialog">
    <h3 id="pd-title">测点</h3>
    <label>声压级 (dB，声级计实测值)
      <input id="pd-spl" type="number" step="0.1" />
    </label>
    <label>备注（设备 / 工况）
      <input id="pd-note" />
    </label>
    <menu>
      <button value="cancel">取消</button>
      <button id="pd-clear" type="button" class="danger">清除该点</button>
      <button id="pd-save" value="save" class="primary">保存</button>
    </menu>
  </form>
</dialog>

<input type="file" id="import-file" accept=".json" hidden />
<input type="file" id="basemap-file" accept=".jpg,.jpeg,.png,.webp,.bmp,.gif,.pdf,.dxf" hidden />
<script type="module" src="/src/main.ts"></script>
</body>
</html>
