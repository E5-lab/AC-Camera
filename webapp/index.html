<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AC-Camera · 厂区噪声网格测量</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>AC-Camera</h1>
      <div class="side-actions">
        <button id="btn-new-project" class="primary">＋ 新建项目</button>
        <button id="btn-export">导出 JSON</button>
        <button id="btn-import">导入 JSON</button>
      </div>
      <div id="project-list"></div>
      <div id="storage-hint" class="hint"></div>
    </aside>
    <main id="main">
      <div id="empty-state" class="empty">← 选择或新建一个项目开始测量</div>
      <div id="workspace" hidden>
        <header id="ws-header">
          <h2 id="ws-title"></h2>
          <div id="ws-meta" class="hint"></div>
        </header>
        <nav id="tabs">
          <button class="tab active" data-tab="entry">数据录入</button>
          <button class="tab" data-tab="contour">等声压级图</button>
          <button class="tab" data-tab="settings">网格设置</button>
        </nav>
        <section id="tab-entry" class="tab-page">
          <div class="toolbar">
            <span id="entry-progress" class="hint"></span>
            <span class="spacer"></span>
            <label>缩放 <span id="entry-zoom-label">1.0×</span></label>
            <button data-zoom="in">＋</button>
            <button data-zoom="out">－</button>
            <button data-zoom="fit">适应网格</button>
          </div>
          <div id="entry-canvas-wrap" class="canvas-wrap"></div>
          <p class="hint">测点位于网格线交汇处（不是格内）。滚轮缩放、拖动平移、单击交汇点录入。</p>
        </section>
        <section id="tab-contour" class="tab-page" hidden>
          <div class="toolbar">
            <label>色阶</label>
            <div id="band-choices"></div>
            <label>透明度 <span id="alpha-label">72%</span></label>
            <input type="range" id="alpha-slider" min="10" max="100" value="72" />
            <span class="spacer"></span>
            <label>视图 <span id="contour-zoom-label">1.0×</span></label>
            <button data-czoom="in">＋</button>
            <button data-czoom="out">－</button>
            <button data-czoom="fit">适应网格</button>
          </div>
          <div id="contour-canvas-wrap" class="canvas-wrap"></div>
          <div id="contour-legend"></div>
        </section>
        <section id="tab-settings" class="tab-page" hidden>
          <form id="settings-form">
            <label>项目名称 <input name="name" required /></label>
            <label>备注（厂名/区域） <input name="description" /></label>
            <div class="row">
              <label>列数（网格单元） <input name="cols" type="number" min="2" max="60" required /></label>
              <label>行数（网格单元） <input name="rows" type="number" min="2" max="60" required /></label>
            </div>
            <div class="row">
              <label>列间距 (m) <input name="spacingX" type="number" step="0.1" min="0.1" required /></label>
              <label>行间距 (m) <input name="spacingY" type="number" step="0.1" min="0.1" required /></label>
            </div>
            <label>背景噪声 / 底噪 (dBA) <input name="backgroundNoiseDb" type="number" step="0.1" min="0" /></label>
            <button class="primary" type="submit">保存设置</button>
          </form>
        </section>
      </div>
    </main>
  </div>
  <!-- 录入弹窗 -->
  <dialog id="point-dialog">
    <form method="dialog">
      <h3 id="pd-title">测点</h3>
      <label>声压级 (dB，声级计实测值)
        <input id="pd-spl" type="number" step="0.1" />
      </label>
      <label>备注（设备 / 工况）
        <input id="pd-note" />
      </label>
      <menu>
        <button value="cancel">取消</button>
        <button id="pd-clear" type="button" class="danger">清除该点</button>
        <button id="pd-save" value="save" class="primary">保存</button>
      </menu>
    </form>
  </dialog>
  <input type="file" id="import-file" accept=".json" hidden />
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
