[package]
name = "accamera"
version = "0.1.0"
description = "AC-Camera factory noise grid survey (Windows)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[lib]
name = "accamera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "accamera"
path = "src/main.rs"
