[package]
name = "noiseatlas"
version = "0.2.0"
description = "NoiseAtlas - factory noise grid survey and equal-SPL mapping (Windows)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[lib]
name = "noiseatlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "noiseatlas"
path = "src/main.rs"
