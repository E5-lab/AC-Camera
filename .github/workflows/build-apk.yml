name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to create/update GitHub Releases (public assets, no-auth download).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (capture log)
        id: build
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Publish build log to release (always)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI Build Logs
          prerelease: true
          force: true
          files: build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to release (on success)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Debug APK (latest build)
          prerelease: true
          force: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
