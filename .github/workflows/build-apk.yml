name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to create/update GitHub Releases (public assets, no-auth download).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Upload APK as artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish build log to release (always, for debugging)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI Build Logs
          prerelease: true
          force: true
          files: build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to release (on success)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Debug APK (latest build)
          prerelease: true
          force: true
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
