name: Build APK & Windows client

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to create/update GitHub Releases (public assets, no-auth download).
permissions:
  contents: write

jobs:
  # ───────────────────────── Android (phone) — debug APK ─────────────────────────
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Upload APK as artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish build log to release (always, for debugging)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI Build Logs
          prerelease: true
          force: true
          files: build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to release (on success)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Debug APK (latest build)
          prerelease: true
          force: true
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Android (phone) — signed release APK ─────────────────────────
  # Builds a signed release APK when a keystore is provided via GitHub Secrets:
  #   AC_CAMERA_KEYSTORE_BASE64  base64 of the .jks / .keystore file
  #   AC_CAMERA_KEYSTORE_PASSWORD
  #   AC_CAMERA_KEY_ALIAS
  #   AC_CAMERA_KEY_PASSWORD
  # If none are set, this job is a no-op (the unsigned release task is simply skipped).
  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.AC_CAMERA_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.AC_CAMERA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AC_CAMERA_KEY_ALIAS }}
          KEY_PW: ${{ secrets.AC_CAMERA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ac-camera-release.jks"
            {
              echo "AC_CAMERA_KEYSTORE_PATH=$RUNNER_TEMP/ac-camera-release.jks"
              echo "AC_CAMERA_KEYSTORE_PASSWORD=$KEYSTORE_PW"
              echo "AC_CAMERA_KEY_ALIAS=$KEY_ALIAS"
              echo "AC_CAMERA_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        id: build
        if: ${{ env.AC_CAMERA_KEYSTORE_PATH != '' }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee release-build.log

      - name: Publish signed release APK (on success)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-release
          name: Release APK (signed)
          prerelease: false
          force: true
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            release-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release build log (on run)
        if: ${{ steps.build.outcome != 'skipped' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI Build Logs
          prerelease: true
          force: true
          files: release-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Windows (desktop) ─────────────────────────
  # Compose Desktop / jpackage cannot cross-build a Windows executable on Linux, so this job runs on
  # a Windows runner. It produces:
  #   - a portable ZIP (bundled JRE, no installer)            -> createDistributable
  #   - an MSI installer  (WiX, preinstalled on the runner)  -> packageMsi
  #   - an EXE installer  (NSIS, installed via choco)        -> packageExe
  # Installers are optionally Authenticode-signed if WINDOWS_SIGN_PFX / WINDOWS_SIGN_PASSWORD secrets exist.
  build-desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NSIS (required for the EXE installer)
        run: choco install nsis -y

      - name: Build MSI installer
        id: buildmsi
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :desktopApp:packageMsi --no-daemon 2>&1 | tee desktop-msi.log

      - name: Build EXE installer
        id: buildexe
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :desktopApp:packageExe --no-daemon 2>&1 | tee desktop-exe.log

      - name: Build portable distributable (bundled JRE)
        id: buildzip
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :desktopApp:createDistributable --no-daemon 2>&1 | tee desktop-build.log

      - name: Prepare code-signing certificate (optional)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX }}
          PFX_PW: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if ($env:PFX_B64 -and $env:PFX_B64.Trim().Length -gt 0) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\ac-camera.pfx", [Convert]::FromBase64String($env:PFX_B64))
            echo "SIGN_PFX=$env:RUNNER_TEMP\ac-camera.pfx" >> $env:GITHUB_ENV
            echo "SIGN_PW=$env:PFX_PW" >> $env:GITHUB_ENV
          }

      - name: Sign installers (optional)
        if: success()
        shell: pwsh
        run: |
          if (Test-Path "$env:SIGN_PFX") {
            signtool sign /f "$env:SIGN_PFX" /p "$env:SIGN_PW" /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 "desktopApp/build/compose/binaries/main/msi/AC-Camera-1.0.0.msi"
            signtool sign /f "$env:SIGN_PFX" /p "$env:SIGN_PW" /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 "desktopApp/build/compose/binaries/main/exe/AC-Camera-1.0.0.exe"
          } else { Write-Host "No signing certificate provided; skipping code signing." }

      - name: Zip the portable distributable
        if: steps.buildzip.outcome == 'success'
        shell: pwsh
        run: |
          $src = "desktopApp/build/compose/binaries/main/app/AC-Camera"
          if (-not (Test-Path $src)) { Get-ChildItem -Recurse desktopApp/build/compose | Out-String; exit 1 }
          Compress-Archive -Path "$src/*" -DestinationPath AC-Camera-Windows.zip -Force

      - name: Upload installers as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-camera-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            AC-Camera-Windows.zip

      - name: Publish desktop build logs to release (always)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI Build Logs
          prerelease: true
          force: true
          files: |
            desktop-msi.log
            desktop-exe.log
            desktop-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Windows installers to release (on success)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Windows 客户端 (latest build)
          prerelease: true
          force: true
          fail_on_unmatched_files: false
          files: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            AC-Camera-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
